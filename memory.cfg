MEMORY {
    TASKS:    file = "",               start = $0000, size = $2000;
    DSPL:     file = "",               start = $2000, size = $2000;
    TCTL:     file = "",               start = $4000, size = $2000;
    RAM:      file = %O, define = yes, start = $6000, size = $FC00 - $6000;
    # $FC00-$FFFF is MMIO - only INFO (skipped by loader) and vectors may go there
    INFO:     file = %O,               start = $FC00, size = $0100;
    VECN:     file = %O, define = yes, start = $FFE4, size = $000C;
    VECE:     file = %O, define = yes, start = $FFF4, size = $000C;
}

SEGMENTS {
    DISPLAY:  load = DSPL,  type = rw, define = yes;
    TCB:      load = TCTL,  type = rw;
    CIOCB:    load = TCTL,  type = rw;
    STARTUP:  load = RAM,   type = ro;
    CODE:     load = RAM,   type = ro;
    RODATA:   load = RAM,   type = ro;
    DATA:     load = RAM,   type = rw,  define  = yes;
    BSS:      load = RAM,   type = bss, define  = yes;
    INFO:     load = INFO,  type = ro,  start   = $FC00;
    VECTORS_N: load = VECN, type = ro;
    VECTORS_E: load = VECE, type = ro;
    ZEROPAGE: load = TASKS, type = zp,  start   = $0000;
}

FILES {
    %O: format = atari;
}
